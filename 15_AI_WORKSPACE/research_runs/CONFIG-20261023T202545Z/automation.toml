prompt = "Continue PROJECT LEVI in this existing chat and its existing archive at /Users/sullyeash/Documents/LEVI-FRADY-CASE. The saved project path /Users/sullyeash/Documents/ChatGPT/LEVI-FRADY is stale; never recreate an empty archive there. Use an explicit valid cwd if needed. Read and follow 00_ADMIN/AUTONOMOUS_RESEARCH_PROTOCOL.md, AGENTS.md, applicable ingestion protocols and research rules.\n\nPerform ASSESS → PRIORITIZE → RESEARCH → ACQUIRE → INGEST → VALIDATE → CROSS-REFERENCE → SYNTHESIZE → UPDATE. Before searching inspect all current source/file, claim/attribution, contradiction/version, event/time, person, organization, location, evidence, witness, asset and relationship registers; Discovery Inbox/board state; WANTED_SOURCES.md; 01_MASTER_CASE/research_questions/OPEN_QUESTIONS.md; recent Markdown/PDF/media batches; previous research and failed-search logs; and 15_AI_WORKSPACE/research_queue.md. Reuse prior state, not a fresh generic search.\n\nChoose one bounded highest-value P0–P3 target or productive source chain. Prioritize public government/court records and reproduced originals, 1997–2001 reporting, original interviews/recordings/video, documentary assets, underlying sources and consequential provenance/corroboration/conflicts. Search strategically with names, dates, quotations, headlines, agencies, locations and document/case identifiers. Avoid exhausted queries. Deprioritize repeated failures; for offline/Open Records targets document exact record, likely custodian, basis and acquisition method rather than repeat hourly. Do not bypass restrictions, contact anyone, submit requests/forms, purchase access or publish without separate authorization.\n\nCheck URL/title/date/hash/existing SRC and underlying-source identity before acquiring. Preserve source bytes and original URL/access date; keep raw sources, OCR, reading copies and analysis separate. Record URL-only references honestly when local acquisition is unavailable. Use existing backup-protected review-plan workflow and schemas; do not reapply committed batches or blindly execute old batch scripts. Add only meaningful supported SRC/CLM/EVT/PER/ORG/LOC/EVD/WIT/CON/AST records and source-dependency relationships.\n\nEvery consequential claim retains SRC, exact locator, actual speaker, firsthand/hearsay chain and representation. Preserve time/date precision, approximation/ranges and publication/interview/event distinction. Claims start REPORTED/ALLEGED/UNKNOWN/DISPUTED, never automatically CONFIRMED. No guilt inference, unsupported suspect label or name-based identity merge. Repetition is not independent corroboration; community information is source discovery; AI analysis is not evidence. Keep contradictory versions UNRESOLVED with neutral possible explanations; uncertain identities, quotes, evidence and assets go to human review/Discovery Inbox.\n\nValidate hashes, unchanged originals, IDs/references and claim-source consistency. Update queue, wanted sources, open questions, indexes/timeline and audit trail. After meaningful updates run npm run case in tools/research_board with CASE_ARCHIVE_ROOT set to the actual archive, inspect warnings, and verify board/inbox inclusion. CSVs are canonical; SQLite is disposable. Keep hypotheses separate from sourced relationships. Avoid concurrent register writes.\n\nEvery run writes 15_AI_WORKSPACE/research_runs/RUN-<UTC timestamp>.md and updates INDEX.md with TARGET, SEARCHES, ACQUIRED, FINDINGS, CORROBORATION, CONTRADICTIONS, LEADS, FAILED SEARCHES, FILES UPDATED and NEXT TARGETS. Record unsuccessful strategies in failed_searches/search_log.csv with target, exact query/strategy, archive, result, alternative and reconsideration condition. Log access/permission/network/sync failures honestly. Attempt one meaningful improvement; never fabricate progress or add volume for its own sake. Stay quiet when unchanged or merely unsuccessful; notify only for meaningful discoveries/changes, completed acquisitions, failures or required user decisions. Do not create another automation."
