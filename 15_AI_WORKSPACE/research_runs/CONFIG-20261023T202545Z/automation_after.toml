prompt = "Continue PROJECT LEVI in this existing chat and its existing archive at /Users/sullyeash/Documents/LEVI-FRADY-CASE. The saved project path /Users/sullyeash/Documents/ChatGPT/LEVI-FRADY is stale; never recreate an empty archive there. Use an explicit valid cwd if needed. Read and follow 00_ADMIN/AUTONOMOUS_RESEARCH_PROTOCOL.md, AGENTS.md, applicable ingestion protocols and research rules.\n\nPerform ASSESS → PRIORITIZE → RESEARCH → ACQUIRE → INGEST → VALIDATE → CROSS-REFERENCE → SYNTHESIZE → UPDATE. Before searching inspect all current source/file, claim/attribution, contradiction/version, event/time, person, organization, location, evidence, witness, asset and relationship registers; Discovery Inbox/board state; WANTED_SOURCES.md; 01_MASTER_CASE/research_questions/OPEN_QUESTIONS.md; recent Markdown/PDF/media batches; previous research and failed-search logs; and 15_AI_WORKSPACE/research_queue.md. Reuse prior state, not a fresh generic search.\n\nChoose one bounded highest-value P0–P3 target or productive source chain. Prioritize public government/court records and reproduced originals, 1997–2001 reporting, original interviews/recordings/video, documentary assets, underlying sources and consequential provenance/corroboration/conflicts. Search strategically with names, dates, quotations, headlines, agencies, locations and document/case identifiers. Avoid exhausted queries. Deprioritize repeated failures; for offline/Open Records targets document exact record, likely custodian, basis and acquisition method rather than repeat hourly. Do not bypass restrictions, contact anyone, submit requests/forms or purchase access without separate authorization. The user now authorizes validated research/data publication through the existing Git/Vercel integration only under the release gates below.\n\nCheck URL/title/date/hash/existing SRC and underlying-source identity before acquiring. Preserve source bytes and original URL/access date; keep raw sources, OCR, reading copies and analysis separate. Record URL-only references honestly when local acquisition is unavailable. Use existing backup-protected review-plan workflow and schemas; do not reapply committed batches or blindly execute old batch scripts. Add only meaningful supported SRC/CLM/EVT/PER/ORG/LOC/EVD/WIT/CON/AST records and source-dependency relationships.\n\nEvery consequential claim retains SRC, exact locator, actual speaker, firsthand/hearsay chain and representation. Preserve time/date precision, approximation/ranges and publication/interview/event distinction. Claims start REPORTED/ALLEGED/UNKNOWN/DISPUTED, never automatically CONFIRMED. No guilt inference, unsupported suspect label or name-based identity merge. Repetition is not independent corroboration; community information is source discovery; AI analysis is not evidence. Keep contradictory versions UNRESOLVED with neutral possible explanations; uncertain identities, quotes, evidence and assets go to human review/Discovery Inbox.\n\nValidate hashes, unchanged originals, IDs/references and claim-source consistency. Update queue, wanted sources, open questions, indexes/timeline and audit trail. After meaningful updates follow 00_ADMIN/RESEARCH_RELEASE_PROTOCOL.md, use npm run case:sync and npm run case:validate in tools/research_board with CASE_ARCHIVE_ROOT set to the actual archive, inspect blocking errors/warnings, and verify board/inbox inclusion. Read live scripts; npm run case is no longer a sync-only command. CSVs are canonical; generated board data are disposable. Keep hypotheses separate from sourced relationships. Avoid concurrent register writes.\n\nEvery run writes 15_AI_WORKSPACE/research_runs/RUN-<UTC timestamp>.md and updates INDEX.md with TARGET, SEARCHES, ACQUIRED, FINDINGS, CORROBORATION, CONTRADICTIONS, LEADS, FAILED SEARCHES, FILES UPDATED and NEXT TARGETS. Record unsuccessful strategies in failed_searches/search_log.csv with target, exact query/strategy, archive, result, alternative and reconsideration condition. Log access/permission/network/sync failures honestly. Attempt one meaningful improvement; never fabricate progress or add volume for its own sake. Stay quiet when unchanged or merely unsuccessful; notify only for meaningful discoveries/changes, completed acquisitions, failures or required user decisions. Do not create another automation.\n\nRESEARCH RELEASE POLICY (required after each loop): Read 00_ADMIN/RESEARCH_RELEASE_PROTOCOL.md. Determine whether meaningful research/archive/data changed, excluding log/timestamp/cache-only churn. If nothing meaningful changed, log exactly No deployment required; no empty commit, push or deployment. For meaningful changes run sequentially npm run case:sync, npm run case:validate, and npm run case:release-check in tools/research_board. The release gate must include required tests, type checking and production build. Any blocking error, nonzero step or missing required command stops the release: no push, log diagnostics and create/update 15_AI_WORKSPACE/development_requests/DEV-*.md. Warnings proceed only under established validator rules. Do not silently substitute npm run case for the missing named release gate or change package/application code to pass.\n\nInspect staged/unstaged/untracked changes and all commits/diffs ahead of the remote production branch before and after checks. Routine releases allow only this run's supported research/data/registered sources and established generated board artifacts. Any protected application/UI/API code, scripts/tests, dependencies/lockfiles, deployment/config/protocol changes or unrelated/pre-existing work blocks production push for developer/human review. No blanket staging, no secrets/credentials/temp downloads, no stash/reset/discard/amend/force-push, no merging another person's work. If the app needs new capability, create a development request; do not refactor/fix it during hourly research.\n\nVerify the linked Vercel project and its configured Production Branch from authoritative settings; never assume main from the local branch. For this archive the linked project is coldcase (prj_4BeeDRR0Ge81xE5RKUX7licH22Ye, team_DmkGw1i8EDsKyZset7xPxhoe), Git remote https://github.com/sullivaneash-boop/coldcase.git. At setup the connector did not expose the Production Branch; unknown target blocks push. Recheck live state and open development requests; a fixed prerequisite should not block forever because of a historical note.\n\nOnly after all gates/scope/target checks pass, explicitly stage reviewed files, make a descriptive research commit including RUN ID/date (e.g. research: ingest sources and update case board [automated]), capture SHA, and push normally to the verified Vercel Production Branch. Use Git/Vercel automatic deployment, not a duplicate manual deployment. Verify successful production deployment for that exact SHA when status is accessible. Pending/inaccessible stays PENDING and Production updated NO. On Vercel failure log it, create a DEVELOPMENT REQUEST, preserve last known-good production and never alter evidence to hide failure. Do not recursively deploy only to add commit/deployment metadata to the log.\n\nEvery run log MUST include these exact fields: Data changed: YES/NO; Validation: PASS/WARN/FAIL; Release check: PASS/FAIL; Commit: <SHA or NONE>; Push: SUCCESS/FAILED/NOT REQUIRED; Vercel deployment: SUCCESS/FAILED/PENDING/NOT REQUIRED; Production updated: YES/NO. Give actual command/exit and blocked/skipped reasons. PASS requires execution success. For the enum without NOT RUN, use fail-closed FAIL with an explicit NOT RUN/no release required or blocked reason; never imply skipped checks ran. For required releases held before push, Push FAILED must say NOT ATTEMPTED—blocked by gate. No push means Vercel NOT REQUIRED. No-op runs log No deployment required. Preserve original research standards and stay quiet for unchanged routine runs. All external-contact restrictions remain; this only authorizes gated research/data Git publication. No new automation. To avoid conflicting with development work, first inspect current Git status and development_requests before any release attempt."
